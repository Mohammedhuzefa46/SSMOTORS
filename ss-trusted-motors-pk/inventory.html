<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — SS Trusted Motors</title>
  <meta name="description" content="Browse all pre-owned cars at SS Trusted Motors — Premium BMWs, Mercedes, Audis, SUVs, Sedans, and Hatchbacks in Hyderabad.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="header-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <div class="page-hero-content">
      <div class="page-breadcrumb"><a href="index.html">Home</a><span>›</span><span>Inventory</span></div>
      <div class="section-label">All Vehicles</div>
      <h1 class="section-title" style="margin-top:14px;font-size:clamp(2.5rem,5vw,4.5rem);">Car Inventory</h1>
      <p class="section-sub" style="margin-top:14px;">Browse 22+ quality-inspected pre-owned vehicles — premium German marques, tough SUVs, refined sedans, and practical hatchbacks. Every car fully documented.</p>
    </div>
  </div>
</section>

<section>
  <div class="container">

    <!-- Category Tabs -->
    <div class="category-tabs" id="cat-tabs">
      <button class="cat-tab active" data-cat="all">All Cars <span class="count" id="cnt-all">0</span></button>
      <button class="cat-tab" data-cat="premium">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Premium <span class="count" id="cnt-premium">0</span>
      </button>
      <button class="cat-tab" data-cat="suv"> SUVs <span class="count" id="cnt-suv">0</span></button>
      <button class="cat-tab" data-cat="sedan"> Sedans <span class="count" id="cnt-sedan">0</span></button>
      <button class="cat-tab" data-cat="small">Hatchbacks <span class="count" id="cnt-small">0</span></button>
    </div>

    <!-- Brand Pills (shown for premium) -->
    <div class="brand-strip" id="brand-strip" style="display:none;">
      <span style="font-family:var(--font-condensed);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);">Brand:</span>
      <button class="brand-pill active" data-brand="all">All</button>
      <button class="brand-pill" data-brand="BMW">BMW</button>
      <button class="brand-pill" data-brand="Mercedes">Mercedes-Benz</button>
      <button class="brand-pill" data-brand="Audi">Audi</button>
      <button class="brand-pill" data-brand="Volvo">Volvo</button>
    </div>

    <!-- Filter + Search bar -->
    <div class="filter-bar">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Petrol">Petrol</button>
      <button class="filter-btn" data-filter="Diesel">Diesel</button>
      <button class="filter-btn" data-filter="Automatic">Automatic</button>
      <button class="filter-btn" data-filter="Manual">Manual</button>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <select id="sort-select" style="background:var(--bg-warm);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 14px;font-family:var(--font-condensed);font-size:.85rem;outline:none;cursor:pointer;">
          <option value="default">Sort: Default</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="year-desc">Newest First</option>
          <option value="year-asc">Oldest First</option>
        </select>
        <div class="filter-search"><input type="text" id="search-input" placeholder="Search by name…" autocomplete="off"></div>
      </div>
    </div>

    <div id="results-bar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
      <div id="results-count" style="font-family:var(--font-condensed);font-size:.82rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;"></div>
    </div>

    <div class="cars-grid" id="cars-container">
      <div class="loading-state" style="grid-column:1/-1;"><div class="loading-spinner"></div>Loading inventory…</div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
let allCars = [];
let activeCat = 'all';
let activeBrand = 'all';
let activeFilter = 'all';
let searchQuery = '';
let sortMode = 'default';

function updateCounts(){
  document.getElementById('cnt-all').textContent = allCars.length;
  ['premium','suv','sedan','small'].forEach(c=>{
    const el = document.getElementById('cnt-'+c);
    if(el) el.textContent = allCars.filter(x=>x.subcategory===c).length;
  });
}

function renderCars(){
  let filtered = [...allCars];

  if(activeCat !== 'all') filtered = filtered.filter(c=>c.subcategory===activeCat);
  if(activeBrand !== 'all') filtered = filtered.filter(c=>c.brand===activeBrand);
  if(activeFilter !== 'all') filtered = filtered.filter(c=>c.fuel===activeFilter||c.transmission===activeFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    filtered=filtered.filter(c=>c.name.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)||c.color.toLowerCase().includes(q)||String(c.year).includes(q)||(c.brand&&c.brand.toLowerCase().includes(q)));
  }
  if(sortMode==='price-asc') filtered.sort((a,b)=>a.price-b.price);
  else if(sortMode==='price-desc') filtered.sort((a,b)=>b.price-a.price);
  else if(sortMode==='year-desc') filtered.sort((a,b)=>b.year-a.year);
  else if(sortMode==='year-asc') filtered.sort((a,b)=>a.year-b.year);

  const container = document.getElementById('cars-container');
  document.getElementById('results-count').textContent = `${filtered.length} vehicle${filtered.length!==1?'s':''} found`;

  if(!filtered.length){
    container.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><p>No vehicles match your search.</p><button class="btn btn-outline" style="margin-top:16px" onclick="resetAll()">Clear All Filters</button></div>`;
    return;
  }
  container.innerHTML = filtered.map(c=>SS.carCardHTML(c,'car')).join('');
  SS.triggerReveal(container);
}

function resetAll(){
  activeCat='all'; activeBrand='all'; activeFilter='all'; searchQuery=''; sortMode='default';
  document.getElementById('search-input').value='';
  document.getElementById('sort-select').value='default';
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.toggle('active',b.dataset.cat==='all'));
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));
  document.querySelectorAll('.brand-pill').forEach(b=>b.classList.toggle('active',b.dataset.brand==='all'));
  document.getElementById('brand-strip').style.display='none';
  renderCars();
}

(async function(){
  // Read URL param
  const urlCat = new URLSearchParams(location.search).get('cat');

  try{
    allCars = await SS.fetchJSON('data/cars.json');
    updateCounts();

    if(urlCat){
      activeCat = urlCat;
      document.querySelectorAll('.cat-tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===urlCat));
      if(urlCat==='premium') document.getElementById('brand-strip').style.display='flex';
    }
    renderCars();
  }catch(e){
    document.getElementById('cars-container').innerHTML='<div class="empty-state" style="grid-column:1/-1;"><p>Failed to load inventory.</p></div>';
  }

  // Category tabs
  document.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeCat=btn.dataset.cat; activeBrand='all';
      document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.brand-pill').forEach(b=>b.classList.toggle('active',b.dataset.brand==='all'));
      document.getElementById('brand-strip').style.display = activeCat==='premium'?'flex':'none';
      renderCars();
    });
  });

  // Brand pills
  document.querySelectorAll('.brand-pill').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeBrand=btn.dataset.brand;
      document.querySelectorAll('.brand-pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderCars();
    });
  });

  // Fuel/transmission filters
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeFilter=btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderCars();
    });
  });

  // Search
  let st;
  document.getElementById('search-input').addEventListener('input',e=>{
    clearTimeout(st);
    st=setTimeout(()=>{searchQuery=e.target.value.trim();renderCars();},300);
  });

  // Sort
  document.getElementById('sort-select').addEventListener('change',e=>{sortMode=e.target.value;renderCars();});
})();
</script>
</body>
</html>
